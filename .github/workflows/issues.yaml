name: Forward issue + PR activity to project board manager

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  id-token: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: ./
        with:
          endpoint_url: "https://us-central1-project-board-manager.cloudfunctions.net/ingestGithubDataEvents"
          oidc_audience: "https://us-central1-project-board-manager.cloudfunctions.net/ingestGithubDataEvents"
