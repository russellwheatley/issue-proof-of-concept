name: Forward issue activity to external tracker

on:
  issues:
    types:
      - opened
      - reopened
      - labeled
      - unlabeled
  issue_comment:
    types:
      - created

permissions:
  id-token: write     # allows requesting a GitHub OIDC ID token
  contents: read
  issues: read

concurrency:
  group: issue-forward-${{ github.repository }}-${{ github.event.issue.number || github.event.issue.id }}
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest

    # ✅ Configure everything here 
    env:
      # Your cloud function endpoint (full URL)
      ENDPOINT_URL: "https://YOUR-CLOUD-FUNCTION.example.com/ingest"

      # Audience string that your cloud function will enforce in the OIDC token.
      # Best practice: use the endpoint origin (scheme + host), or any stable identifier you check server-side.
      OIDC_AUDIENCE: "https://YOUR-CLOUD-FUNCTION.example.com"

    steps:
      # Only forward issue_comment.created when it's the original poster (OP) responding
      - name: Decide whether to send event
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          EVENT_NAME="${{ github.event_name }}"
          ACTION="${{ github.event.action }}"

          SHOULD_SEND="true"

          if [[ "$EVENT_NAME" == "issue_comment" && "$ACTION" == "created" ]]; then
            ISSUE_AUTHOR="${{ github.event.issue.user.login }}"
            COMMENT_AUTHOR="${{ github.event.comment.user.login }}"
            if [[ "$ISSUE_AUTHOR" != "$COMMENT_AUTHOR" ]]; then
              SHOULD_SEND="false"
            fi
          fi

          echo "should_send=$SHOULD_SEND" >> "$GITHUB_OUTPUT"

      - name: Build payload
        if: steps.gate.outputs.should_send == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cat > payload.json << 'EOF'
          {
            "source": "github-actions",
            "event_name": "${{ github.event_name }}",
            "action": "${{ github.event.action }}",
            "delivery": "${{ github.run_id }}:${{ github.run_attempt }}",

            "repository": "${{ github.repository }}",
            "repository_owner": "${{ github.repository_owner }}",

            "issue": {
              "id": "${{ github.event.issue.id }}",
              "number": ${{ github.event.issue.number }},
              "title": ${{ toJson(github.event.issue.title) }},
              "html_url": "${{ github.event.issue.html_url }}",
              "state": "${{ github.event.issue.state }}",
              "created_at": "${{ github.event.issue.created_at }}",
              "updated_at": "${{ github.event.issue.updated_at }}",
              "author": "${{ github.event.issue.user.login }}",
              "labels": ${{ toJson(github.event.issue.labels.*.name) }},
              "comments": ${{ github.event.issue.comments }}
            },

            "label_change": {
              "label": ${{ toJson(github.event.label.name) }}
            },

            "op_response": {
              "is_op": ${{ github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.comment.user.login == github.event.issue.user.login }},
              "comment_id": "${{ github.event.comment.id }}",
              "comment_html_url": "${{ github.event.comment.html_url }}",
              "comment_author": "${{ github.event.comment.user.login }}",
              "comment_created_at": "${{ github.event.comment.created_at }}"
            }
          }
          EOF

          # Note:
          # - For non-label events, github.event.label may be null; your server should tolerate that.
          # - For non-comment events, github.event.comment fields will be null; tolerate that too.

      - name: Get GitHub OIDC token (audience-bound)
        if: steps.gate.outputs.should_send == 'true'
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const aud = process.env.OIDC_AUDIENCE;
            const token = await core.getIDToken(aud);
            core.setOutput("token", token);

      - name: POST to endpoint
        if: steps.gate.outputs.should_send == 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail

          curl -sS -X POST "${ENDPOINT_URL}" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json
